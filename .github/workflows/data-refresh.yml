name: data-refresh

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC weekdays, after US close
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Mondays (and manual runs) also re-fetch the last 120 days of every live
      # stock and ETF and repair stretches where a dividend or split was spliced
      # onto an old adjustment basis (see scripts/update_data.py). The first run
      # also seeds the T-bill rate series protocol v3 needs.
      - name: Refresh price store
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/update_data.py --max-age-bdays 0 --verify-days 120
          else
            python scripts/update_data.py --max-age-bdays 0
          fi

      # Weekly (Mondays): apply today's index constituent lists to the
      # point-in-time membership spells and fetch prices for new members.
      # Never deletes: a name that leaves an index has its spell closed.
      - name: Evolve point-in-time membership
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/build_membership.py
          else
            echo "not Monday — membership left unchanged"
          fi

      # Weekly: score every incubating candidate on the trading days after it
      # was registered (forward, out-of-sample). For humans; strategy sessions
      # do not read reports/incubation.md.
      - name: Forward incubation report
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/incubation_report.py || echo "incubation report failed (non-fatal)"
          fi

      - name: Commit updated parquet
        run: |
          git config user.name "data-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/store data/membership data/universe_pit.yaml
          if [ -f reports/incubation.md ]; then git add reports/incubation.md; fi
          if git diff --cached --quiet; then
            echo "store already fresh — nothing to commit"
          else
            git commit -m "data: daily refresh $(date -u +%F)"
            git pull --rebase origin main
            git push origin main
          fi
