name: data-refresh

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC weekdays, after US close
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh price store
        run: python scripts/update_data.py --max-age-bdays 0

      - name: Commit updated parquet
        run: |
          git config user.name "data-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/store
          if git diff --cached --quiet; then
            echo "store already fresh — nothing to commit"
          else
            git commit -m "data: daily refresh $(date -u +%F)"
            git pull --rebase origin main
            git push origin main
          fi
