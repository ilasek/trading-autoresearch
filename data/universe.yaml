# Curated starter universe: global large-cap stocks + ETFs, daily bars.
# Fields: id (canonical, used as store filename/column), stooq + yahoo symbols,
# type: stock|etf, currency of the quote. GBX = GBP pence (loader divides by 100).
# Scaling this file up is a data task; keep entries liquid and long-history.

fx:
  # currency -> FX series used to convert quotes to USD.
  # invert: true means the pair is USD/CCY and the loader takes 1/rate.
  EUR: {id: FX_EURUSD, stooq: eurusd, yahoo: "EURUSD=X", invert: false}
  GBP: {id: FX_GBPUSD, stooq: gbpusd, yahoo: "GBPUSD=X", invert: false}
  JPY: {id: FX_USDJPY, stooq: usdjpy, yahoo: "JPY=X", invert: true}
  HKD: {id: FX_USDHKD, stooq: usdhkd, yahoo: "HKD=X", invert: true}

